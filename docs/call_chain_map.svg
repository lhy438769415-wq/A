<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="880" viewBox="0 0 1440 880" font-family="'Microsoft YaHei','微软雅黑',sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
    <marker id="arr" markerWidth="11" markerHeight="11" refX="5.5" refY="5.5" orient="auto">
      <path d="M1,1 L10,5.5 L1,10 Z" fill="#5a6570"/>
    </marker>
    <marker id="arrD" markerWidth="11" markerHeight="11" refX="5.5" refY="5.5" orient="auto">
      <path d="M1,1 L10,5.5 L1,10 Z" fill="#8a6d3b"/>
    </marker>
    <marker id="arrL" markerWidth="11" markerHeight="11" refX="5.5" refY="5.5" orient="auto">
      <path d="M1,1 L10,5.5 L1,10 Z" fill="#b0b8c0"/>
    </marker>
  </defs>

  <rect width="1440" height="880" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="720" y="44" text-anchor="middle" font-size="26" font-weight="bold" fill="#1a1a1a">Brooks-AI 量化扫描系统 · 架构与调用关系</text>
  <text x="720" y="72" text-anchor="middle" font-size="15" fill="#7a828a">当前系统设计的客观静态呈现 · 数据截至 2026-09 · 问题诊断请基于本图单独讨论（不在图中标注）</text>

  <!-- 三个操作入口 -->
  <g filter="url(#sh)">
    <rect x="60" y="96" width="420" height="54" rx="10" fill="#ffffff" stroke="#b0b8c0"/>
    <text x="80" y="122" font-size="16" font-weight="bold" fill="#1a1a1a">桌面操作台（GUI）</text>
    <text x="80" y="142" font-size="12.5" fill="#7a828a">图形界面，点按钮操作</text>

    <rect x="510" y="96" width="420" height="54" rx="10" fill="#ffffff" stroke="#b0b8c0"/>
    <text x="530" y="122" font-size="16" font-weight="bold" fill="#1a1a1a">命令行（VS Code）</text>
    <text x="530" y="142" font-size="12.5" fill="#7a828a">直接运行底层扫描脚本</text>

    <rect x="960" y="96" width="420" height="54" rx="10" fill="#ffffff" stroke="#b0b8c0"/>
    <text x="980" y="122" font-size="16" font-weight="bold" fill="#1a1a1a">交互菜单</text>
    <text x="980" y="142" font-size="12.5" fill="#7a828a">文字菜单选择功能</text>
  </g>

  <!-- 入口到流程的弱连接 -->
  <path d="M270,150 L190,188" stroke="#b0b8c0" stroke-width="2" fill="none" marker-end="url(#arrL)"/>
  <path d="M720,150 L670,188" stroke="#b0b8c0" stroke-width="2" fill="none" marker-end="url(#arrL)"/>
  <path d="M1170,150 L1200,188" stroke="#b0b8c0" stroke-width="2" fill="none" marker-end="url(#arrL)"/>
  <text x="720" y="178" text-anchor="middle" font-size="12.5" fill="#7a828a">三个入口均可触发下方流程（具体接线见各列标题）</text>

  <!-- ① 数据同步循环 绿 -->
  <g filter="url(#sh)">
    <rect x="40" y="188" width="300" height="46" rx="10" fill="#2e7d4f"/>
    <text x="190" y="217" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">① 数据同步循环</text>

    <rect x="60" y="250" width="260" height="76" rx="10" fill="#eaf6ef" stroke="#2e7d4f"/>
    <text x="80" y="282" font-size="16" font-weight="bold" fill="#1a1a1a">⚡ 同步入口</text>
    <text x="80" y="304" font-size="12.5" fill="#5a6570">手动或定时触发</text>

    <rect x="60" y="350" width="260" height="76" rx="10" fill="#eaf6ef" stroke="#2e7d4f"/>
    <text x="80" y="382" font-size="16" font-weight="bold" fill="#1a1a1a">📋 取全市场名单</text>
    <text x="80" y="404" font-size="12.5" fill="#5a6570">A股 3312 只</text>

    <rect x="60" y="450" width="260" height="76" rx="10" fill="#eaf6ef" stroke="#2e7d4f"/>
    <text x="80" y="482" font-size="16" font-weight="bold" fill="#1a1a1a">🔍 增量补缺</text>
    <text x="80" y="504" font-size="12.5" fill="#5a6570">只下载缺失的交易日</text>

    <rect x="60" y="550" width="260" height="76" rx="10" fill="#eaf6ef" stroke="#2e7d4f"/>
    <text x="80" y="582" font-size="16" font-weight="bold" fill="#1a1a1a">💾 存入本地行情库</text>
    <text x="80" y="604" font-size="12.5" fill="#5a6570">data.db（唯一行情源）</text>
  </g>
  <path d="M190,326 L190,350" stroke="#5a6570" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
  <path d="M190,426 L190,450" stroke="#5a6570" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
  <path d="M190,526 L190,550" stroke="#5a6570" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
  <text x="190" y="648" text-anchor="middle" font-size="12" fill="#7a828a">↻ 可独立定时同步</text>

  <!-- ② 猎人主流程 灰蓝 -->
  <g filter="url(#sh)">
    <rect x="360" y="188" width="620" height="46" rx="10" fill="#34495e"/>
    <text x="670" y="209" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">② 猎人主流程（扫描 → 推送）</text>
    <text x="670" y="228" text-anchor="middle" font-size="11.5" fill="#d5dde6">周线缺口三家族 + 日线多策略 · 仅推当日末根触发信号</text>

    <rect x="380" y="252" width="580" height="78" rx="10" fill="#eef2f6" stroke="#34495e"/>
    <text x="400" y="286" font-size="16" font-weight="bold" fill="#1a1a1a">🔎 策略初筛</text>
    <text x="400" y="308" font-size="12.5" fill="#5a6570">扫描全市场 K 线，识别价格行为形态（数据来源：本地行情库）</text>

    <rect x="380" y="354" width="580" height="78" rx="10" fill="#eef2f6" stroke="#34495e"/>
    <text x="400" y="388" font-size="16" font-weight="bold" fill="#1a1a1a">🤖 AI 二次审计</text>
    <text x="400" y="410" font-size="12.5" fill="#5a6570">DeepSeek 复核信号（多数策略暂关）</text>

    <rect x="380" y="456" width="580" height="78" rx="10" fill="#eef2f6" stroke="#34495e"/>
    <text x="400" y="490" font-size="16" font-weight="bold" fill="#1a1a1a">🗂 信号归档</text>
    <text x="400" y="512" font-size="12.5" fill="#5a6570">写入 signal_archive，标记 PENDING</text>

    <rect x="380" y="558" width="580" height="78" rx="10" fill="#eef2f6" stroke="#34495e"/>
    <text x="400" y="592" font-size="16" font-weight="bold" fill="#1a1a1a">📨 推送 Discord</text>
    <text x="400" y="614" font-size="12.5" fill="#5a6570">附 K 线图（周线直推 + 写观察清单）</text>
  </g>
  <path d="M670,330 L670,354" stroke="#5a6570" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
  <path d="M670,432 L670,456" stroke="#5a6570" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
  <path d="M670,534 L670,558" stroke="#5a6570" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
  <text x="670" y="660" text-anchor="middle" font-size="12" fill="#7a828a">↻ 可定时重复（每日 / 每周）</text>

  <!-- ③ 守护流程 红 -->
  <g filter="url(#sh)">
    <rect x="1000" y="188" width="400" height="46" rx="10" fill="#c0392b"/>
    <text x="1200" y="209" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">③ 守护流程（状态跟进）</text>
    <text x="1200" y="228" text-anchor="middle" font-size="11.5" fill="#f5d9d5">由 GUI周线按钮 / --track / 菜单 触发</text>

    <rect x="1020" y="252" width="360" height="150" rx="10" fill="#fdecea" stroke="#c0392b"/>
    <text x="1040" y="284" font-size="16" font-weight="bold" fill="#c0392b">🔄 信号状态机</text>
    <text x="1040" y="312" font-size="12.5" fill="#5a6570">读 signal_archive 的 PENDING / ACTIVE</text>
    <text x="1040" y="336" font-size="12.5" fill="#5a6570">用最新行情核对</text>
    <text x="1040" y="360" font-size="12.5" fill="#5a6570">更新：持仓 / 止盈 / 止损 / 失效 / 过期</text>

    <rect x="1020" y="418" width="360" height="110" rx="10" fill="#fdecea" stroke="#c0392b"/>
    <text x="1040" y="450" font-size="16" font-weight="bold" fill="#c0392b">💼 持仓管家</text>
    <text x="1040" y="478" font-size="12.5" fill="#5a6570">读你手填的持仓清单 + 成本</text>
    <text x="1040" y="502" font-size="12.5" fill="#5a6570">AI 复核「该不该拿」</text>

    <rect x="1020" y="546" width="360" height="70" rx="10" fill="#fdecea" stroke="#c0392b"/>
    <text x="1040" y="578" font-size="16" font-weight="bold" fill="#c0392b">📊 守护报告</text>
    <text x="1040" y="600" font-size="12.5" fill="#5a6570">更新状态 / 推送结论到界面或 Discord</text>
  </g>
  <path d="M1200,402 L1200,418" stroke="#5a6570" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
  <path d="M1200,528 L1200,546" stroke="#5a6570" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
  <text x="1200" y="640" text-anchor="middle" font-size="12" fill="#7a828a">↻ 可定时重复执行</text>

  <!-- 基础设施 -->
  <g filter="url(#sh)">
    <rect x="40" y="730" width="1360" height="92" rx="12" fill="#eef1f3" stroke="#95a5a6"/>
    <text x="60" y="754" font-size="14" font-weight="bold" fill="#2c3e50">基础设施（本地数据）</text>
    <rect x="60" y="766" width="620" height="44" rx="8" fill="#ffffff" stroke="#95a5a6"/>
    <text x="80" y="793" font-size="13" fill="#2c3e50">🗄 行情库 data.db — 本地 SQLite，约 287 万根日线 + 205 万根周线</text>
    <rect x="700" y="766" width="680" height="44" rx="8" fill="#ffffff" stroke="#95a5a6"/>
    <text x="720" y="793" font-size="13" fill="#2c3e50">🗄 信号归档库 signal_archive — 信号全生命周期状态记录</text>
  </g>

  <!-- 跨区数据读写（虚线） -->
  <path d="M190,626 C190,710 370,710 370,766" stroke="#8a6d3b" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrD)"/>
  <path d="M670,636 C670,700 1040,700 1040,766" stroke="#8a6d3b" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrD)"/>
  <path d="M1200,616 C1200,690 1040,690 1040,766" stroke="#8a6d3b" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrD)"/>
  <path d="M1040,766 C1040,640 1200,640 1200,402" stroke="#8a6d3b" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrD)"/>

  <!-- 图例 -->
  <text x="720" y="852" text-anchor="middle" font-size="12" fill="#7a828a">实线箭头＝流程顺序执行　·　虚线＝跨区读写数据（扫描写归档 / 守护读归档）　·　↻＝可定时重复运行</text>
</svg>