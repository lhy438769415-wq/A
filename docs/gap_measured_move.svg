<svg viewBox="0 0 680 430" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui,-apple-system,'Microsoft YaHei',sans-serif">
<title>结构性测量缺口：缺口地板与回调最低低点定出中心轴，再镜像翻倍得出目标位 TP</title>
<desc>前 60 根区间最高高（缺口地板 6.00）与最低低（起涨底 5.55）之间的箱体，被一根突破K向上跳空打破并留下缺口；两腿回调把缺口上沿从初始的 6.35 压低到 6.18，与缺口地板取中点得中心轴 6.09；从起涨底到中心轴的距离向上镜像一倍，得到测距目标 TP = 6.63。</desc>

