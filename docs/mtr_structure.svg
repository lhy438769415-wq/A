<svg viewBox="0 0 680 405" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui,-apple-system,'Microsoft YaHei',sans-serif">
<title>MTR 主结构：H0 主高 → L1 极值 → H1 性质改变 → TL 测试 → 信号K → 入场/止损/目标</title>
<desc>一段从 H0 主高开始的深跌到 L1 极值，第一腿反弹到 H1 并首次收在 EMA20 上方，随后回调测试到 TL、收在 EMA20 下方，TL 之后收出信号K，突破信号K最高价 12.90 入场，止损放 min(L1,TL)−0.01 = 10.99，TP1 = 2R = 16.72。</desc>

