name: CI

# 触发：推到 main 或 向 main 提 PR 时，由 GitHub 云端机器自动跑。
# 作用 = 项目本地 pre-commit 门禁的「云端兜底」：换电脑/别人 clone/绕过本地 hook，
# 脏代码推上来也会被拦截（绿勾 ✅ / 红叉 ❌ 贴在 commit/PR 旁）。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 只装测试真正需要的依赖（不碰 requirements.txt 里的 streamlit/akshare/tushare 重依赖）。
      # 版本与本地 .venv 对齐，避免意外漂移。
      # 注意：tests import hunter/tools.notifier -> config.settings 需要 python-dotenv；hunter 顶层需要 psutil。
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest==8.3.5" "numpy>=2.2,<2.5" "pandas>=2.1" "matplotlib==3.10.8" "mplfinance==0.12.10b0" "requests==2.32.5" "Pillow>=10" "python-dotenv>=1" "psutil>=6" baostock

      # 质量门禁（纯标准库，零第三方依赖）：红线 / DDL 白名单 / 测试数守卫。
      # test_baseline.txt 已强制纳入版本库，CI 上也有 156 基线。
      - name: Quality Gate (red-line / DDL / test-count guard)
        run: python .agent/quality_gate.py

      # 静态 lint (ruff, 非阻断): 仅查高信号规则 (E9 运行时错误 / F 名称类),
      # 避免 700+ 风格告警冲垮绿 CI。结果仅作可见性, 不拦截合并。
      # 待后续清理轮次再把范围扩到全规则并转为硬门禁。
      # 注: main 分支保护 (PR 必过 CI 才能合) 需在 GitHub 仓库 Settings→Branches 手动开启,
      # 非 CI 文件可配置项。
      - name: Lint (ruff, informational)
        continue-on-error: true
        run: |
          python -m pip install ruff
          ruff check core tools hunter.py --select E9,F --exclude "*.bak" || true

      # 跑全套测试，但 --ignore 本地库 schema 守护测试（test_schema_integrity.py）：
      # 那两个测试真打 data/baostock.db（570MB，不入库），CI 云端无此库必失败。
      # 它们是「本地数据完整性护栏」，本地有库照常跑；云端无数据本就跑不了，故排除。
      - name: Run tests (exclude local-DB schema tests)
        run: |
          set -o pipefail
          python -m pytest tests/ --ignore=tests/test_schema_integrity.py -q --tb=short 2>&1 | tee pytest-ci.log

      # 失败时在 step summary 贴出尾部日志，无需登录即可快速看到原因（轻量诊断保险）。
      - name: Summarize pytest output
        if: failure()
        run: |
          echo "## Pytest failure tail (last 80 lines)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 80 pytest-ci.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
