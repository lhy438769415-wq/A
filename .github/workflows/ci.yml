name: CI

# 触发：推到 main 或 向 main 提 PR 时，由 GitHub 云端机器自动跑。
# 作用 = 项目本地 pre-commit 门禁的「云端兜底」：换电脑/别人 clone/绕过本地 hook，
# 脏代码推上来也会被拦截（绿勾 ✅ / 红叉 ❌ 贴在 commit/PR 旁）。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 只装测试真正需要的依赖（不碰 requirements.txt 里的 streamlit/akshare/tushare 重依赖）。
      # 版本与本地 .venv 对齐，避免意外漂移。
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest==8.3.5" "numpy>=2.2,<2.5" "pandas>=2.1" "matplotlib==3.10.8" baostock

      # 质量门禁（纯标准库，零第三方依赖）：红线 / DDL 白名单 / 测试数守卫。
      # test_baseline.txt 已强制纳入版本库，CI 上也有 156 基线。
      - name: Quality Gate (red-line / DDL / test-count guard)
        run: python .agent/quality_gate.py

      # 跑全套测试，但 --ignore 本地库 schema 守护测试（test_schema_integrity.py）：
      # 那两个测试真打 data/baostock.db（570MB，不入库），CI 云端无此库必失败。
      # 它们是「本地数据完整性护栏」，本地有库照常跑；云端无数据本就跑不了，故排除。
      - name: Collect tests first (diagnose import issues)
        run: |
          set -o pipefail
          python -m pytest tests/ --ignore=tests/test_schema_integrity.py --collect-only -v 2>&1 | tee collect.log

      # 把 collect-only / pytest 的关键失败信息写入 GitHub step summary，无需登录即可查看。
      - name: Summarize pytest output
        if: always()
        run: |
          echo "## Collect-only output (last 150 lines)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 150 collect.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Pytest output (last 120 lines)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 120 pytest-ci.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      # 无论测试成败，把详细日志上传为 artifact，方便排查 CI 与本地行为差异。
      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-ci-log
          path: pytest-ci.log
